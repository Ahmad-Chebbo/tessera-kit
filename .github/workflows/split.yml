name: Split

# Copies every folder under packages/ to its own repository and tags it with the version tag pushed here, so a module is
# installed with a plain `composer require`. Needs a repository secret SPLIT_TOKEN: a personal access token that may push
# to the target repositories. Create the empty target repositories first.

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  VENDOR: Ahmad-Chebbo

jobs:
  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { path: packages/engine, repo: tessera-engine }
          - { path: packages/base, repo: tessera-base }
          - { path: packages/core, repo: tessera-core }
          - { path: packages/ui, repo: tessera-ui }
          - { path: packages/modules/attendance, repo: tessera-attendance }
          - { path: packages/modules/catalog, repo: tessera-catalog }
          - { path: packages/modules/customers, repo: tessera-customers }
          - { path: packages/modules/discounts, repo: tessera-discounts }
          - { path: packages/modules/expenses, repo: tessera-expenses }
          - { path: packages/modules/exports, repo: tessera-exports }
          - { path: packages/modules/inventory, repo: tessera-inventory }
          - { path: packages/modules/reports, repo: tessera-reports }
          - { path: packages/modules/sales, repo: tessera-sales }
          - { path: packages/modules/shifts, repo: tessera-shifts }
    steps:
      - uses: actions/checkout@v4

      - name: Split ${{ matrix.path }}
        uses: symplify/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          package_directory: ${{ matrix.path }}
          repository_organization: ${{ env.VENDOR }}
          repository_name: ${{ matrix.repo }}
          branch: main
          tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          user_name: ${{ github.actor }}
          user_email: ${{ github.actor }}@users.noreply.github.com

  starter:
    runs-on: ubuntu-latest
    needs: packages
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavor: saas, repo: tessera-starter }
          - { flavor: fresh, repo: tessera-fresh }
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Build the starter
        run: php bin/build-starter.php "$RUNNER_TEMP/starter" --flavor=${{ matrix.flavor }} --source=vcs --vendor=${{ env.VENDOR }} --uiref=${{ github.ref_name }}

      - name: Publish the starter
        working-directory: ${{ runner.temp }}/starter
        env:
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        run: |
          git init -b main
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -m "${{ matrix.repo }} ${{ github.ref_name }}"
          git tag "${{ github.ref_name }}"
          git remote add origin "https://x-access-token:${SPLIT_TOKEN}@github.com/${{ env.VENDOR }}/${{ matrix.repo }}.git"
          git push --force origin main "${{ github.ref_name }}"
